name: Phase 00 검수

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "phase/**"]

permissions:
  contents: read

jobs:
  verify:
    name: 코드, 빌드 및 브라우저 검수
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: 소스 가져오기
        uses: actions/checkout@v5
      - name: Node.js 설정
        uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm
      - name: 의존성 설치
        run: npm ci
      - name: 타입 검사, 린트, 단위·통합 테스트 및 빌드
        run: npm run check
      - name: Playwright Chromium 및 Linux 라이브러리 설치
        run: npm run test:e2e:install:linux
      - name: 개발 서버 및 브라우저 테스트
        run: npm run test:e2e
      - name: Playwright 결과 보관
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
