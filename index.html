<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#101c2a" />
    <title>3D 테스트 장면 | 시내버스 시뮬레이터</title>
  </head>
  <body>
    <main class="layout">
      <header class="page-header">
        <p class="project">시내버스 시뮬레이터</p>
        <h1>3D 테스트 장면</h1>
      </header>
      <div class="workspace">
        <section id="viewport" class="viewport" aria-label="3D 테스트 뷰포트">
          <canvas id="scene" role="img" aria-label="시험 구역의 3D 뷰"></canvas>
          <span id="render-status" class="render-status" role="status">3D 장면을 준비하는 중</span>
        </section>
        <section id="controls" class="controls" aria-labelledby="controls-title">
          <h2 id="controls-title">장면 조작</h2>
          <p class="hint">방향키 또는 WASD로 표식을 이동합니다.</p>
          <div class="directions" role="group" aria-label="이동">
            <button class="forward" type="button" data-action="forward" aria-label="앞으로">↑</button>
            <button class="left" type="button" data-action="left" aria-label="왼쪽으로">←</button>
            <button class="back" type="button" data-action="back" aria-label="뒤로">↓</button>
            <button class="right" type="button" data-action="right" aria-label="오른쪽으로">→</button>
          </div>
          <div class="view-actions">
            <button type="button" data-action="camera" aria-keyshortcuts="C">시점 전환 <kbd>C</kbd></button>
            <button type="button" data-action="reset">초기화</button>
          </div>
          <dl class="readout">
            <div><dt>시점</dt><dd id="view-label">사선</dd></div>
            <div><dt>표식 좌표 X / Z</dt><dd id="coordinates">0 / 0</dd></div>
          </dl>
        </section>
      </div>
      <noscript>이 테스트 장면을 실행하려면 자바스크립트를 켜세요.</noscript>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
